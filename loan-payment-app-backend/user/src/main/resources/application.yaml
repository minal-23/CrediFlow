server:
  port: 9111
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/regd_users_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: User_Service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
jwt:
  secret:
    key: secretkey
eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/